name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 才能覆盖 Keychain 相关分支；Ubuntu 覆盖纯逻辑
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run coverage
